<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dina Birkedal</title>
    <meta name="description" content="Portefølje for Dina Birkedal – digital markedsføring og salg." />
    <link rel="stylesheet" href="stil.css" />
  </head>
  <body>
    <header class="topp">
      <div class="beholder topp-innhold">
        <a href="#" class="logo" data-felt="navn"></a>
        <nav>
          <a href="#prosjekter">Prosjekter</a>
          <a href="#erfaring">Erfaring</a>
          <a href="#kompetanse">Kompetanse</a>
          <a href="#kontakt">Kontakt</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="helt beholder">
        <div class="helt-tekst">
          <p class="undertittel"><span data-felt="rolle"></span> · <span data-felt="sted"></span></p>
          <h1>Hei, jeg er <span data-felt="navn"></span>.</h1>
          <p class="intro" data-felt="intro"></p>
          <div class="knapper" id="helt-knapper"></div>
        </div>
        <img class="portrett" id="portrett" alt="" />
      </section>

      <section id="prosjekter" class="beholder seksjon">
        <h2>Prosjekter</h2>
        <div class="filter" role="group" aria-label="Filtrer prosjekter"></div>
        <div class="rutenett" id="prosjektliste"></div>
      </section>

      <section id="erfaring" class="beholder seksjon">
        <h2>Arbeidserfaring</h2>
        <ol class="tidslinje" id="erfaringsliste"></ol>

        <h2 class="mellomtittel">Utdanning</h2>
        <ol class="tidslinje" id="utdanningsliste"></ol>
      </section>

      <section id="kompetanse" class="beholder seksjon">
        <h2>Kompetanse</h2>
        <div class="kompetanse" id="kompetanseliste"></div>

        <h2 class="mellomtittel">Om meg</h2>
        <div class="om-tekst" id="om-tekst"></div>
      </section>

      <section id="kontakt" class="beholder seksjon">
        <h2>Kontakt</h2>
        <p>Ta gjerne kontakt om en stilling eller for en prat. Referanser oppgis på forespørsel.</p>
        <div class="knapper" id="kontaktlenker"></div>
      </section>
    </main>

    <footer class="beholder bunn">
      <p>© <span id="år"></span> <span data-felt="navn"></span></p>
    </footer>

    <dialog id="detaljer">
      <button class="lukk" aria-label="Lukk">×</button>
      <div id="detaljer-innhold"></div>
    </dialog>

    <script src="innhold.js"></script>
    <script src="skript.js"></script>
  </body>
</html>
